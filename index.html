*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.app{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;width:100%;max-width:1200px}
@media(max-width:800px){.app{grid-template-columns:1fr}}
.stage{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
/* Avatar: caixa com a proporção da imagem (1024x572); todas as peças usam % */
.avatar{position:relative;width:100%;aspect-ratio:1/1;align-self:center;max-width:min(100%,76vh);border-radius:14px;overflow:hidden;background:var(--img) center/100% 100% no-repeat,radial-gradient(circle at 50% 35%,#3a3f86,#0e1326 75%)}
.avatar>*{position:absolute;pointer-events:none}
/* Pálpebras: o JS dispara o piscar em intervalos aleatórios (Web Animations API) */
.lid{
  background:linear-gradient(#773d3a,#924b47 55%,#9a4f4b);
  border-radius:50% 50% 45% 45%/40% 40% 60% 60%;
  border-bottom:2px solid rgba(28,15,11,.85); /* linha dos cílios na pálpebra fechada */
  transform:scaleY(0);transform-origin:top center;
  filter:blur(.3px)
}
/* Boca: cópia da mandíbula, esticada a partir da linha do lábio superior.
   --abertura (1 = fechada ... 1.4 = máxima) é escrita pelo JS a cada frame. */
.jaw{
  background-image:var(--img);background-repeat:no-repeat;
  transform-origin:top center;
  transform:scaleY(var(--abertura,1));
  transition:transform .05s ease-out;
  --m:radial-gradient(ellipse 50% 100% at 50% 0%,#000 62%,transparent 100%);-webkit-mask-image:var(--m);mask-image:var(--m)
}
/* Interior escuro: nasce na linha do lábio e cresce junto com a abertura (só aparece acima de 1) */
/* cavidade da boca: desenhada em SVG, colada na borda inferior dos dentes que já existem na imagem */
.bocasvg{left:0;top:0;width:100%;height:100%}
.caption{min-height:72px;background:#0e1326;border-radius:12px;padding:12px 16px;line-height:1.45}
.caption b{display:block;color:var(--acc);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.side{display:flex;flex-direction:column;gap:10px;justify-content:center}
.side h2{margin:0 0 4px;font-size:1.2rem}.side p{margin:0 0 8px;color:var(--mut);font-size:.9rem}
button.q{all:unset;cursor:pointer;background:var(--card);border:1px solid #27304f;border-radius:12px;padding:14px 16px;transition:.15s;line-height:1.35}
button.q:hover{border-color:var(--acc);transform:translateX(3px)}
button.q.on{background:var(--acc);border-color:var(--acc)}
button.q:focus-visible{outline:2px solid #fff}
</style>
</head>
<body>
<main class="app">
  <section class="stage">
    <div class="avatar" id="avatar" aria-label="Dora, assistente virtual"></div>
    <div class="caption" aria-live="polite"><b>Dora • Assistente Virtual</b><span id="cap">Olá! Escolha uma pergunta ao lado para eu contar uma curiosidade sobre Feira de Santana.</span><small id="status" style="display:block;margin-top:6px;color:var(--mut)"></small></div>
  </section>
  <aside class="side">
    <h2>Curiosidades de Feira de Santana</h2>
    <p>Clique em uma pergunta:</p>
    <div id="btns" style="display:contents"></div>
  </aside>
</main>
<script>
const perguntas=[
 {q:"Qual o tamanho de Feira de Santana?",t:"Boa pergunta. Olha só, segundo o censo de 2022 do IBGE, Feira de Santana tem 616.272 habitantes. Isso mesmo, é gente que não acaba mais. Somos a segunda cidade mais populosa da Bahia, só ficamos atrás de Salvador. Em 2010, eram cerca de 556 mil. Então, a cidade cresceu uns 11%. Ou seja, se a fila do ônibus anda grande, já sabe o motivo.",audio:"resposta-1.mp3"},
 {q:"Por que é chamada de Princesa do Sertão ?",t:"Essa história é bem bonita. Em 1919, o grande Rui Barbosa visitou a nossa cidade. Na época, Feira já era um centro comercial importante, cheio de movimento por causa da feira de gado, e funcionava como porta de entrada para o sertão. Foi nessa visita que ele nos chamou de Princesa do Sertão, e o apelido pegou de vez. A gente também é conhecida como Portal do Sertão. E olha que até hoje ninguém pediu o título de volta",audio:"resposta-2.mp3"},
 {q:"Onde fica Feira de Santana ?",t:"Vou te passar o endereço. Feira de Santana fica na Bahia, a uns 110 km de Salvador. Se você estiver na capital, é só pegar a estrada e daqui a pouco já está por aqui, de preferência com um lanchinho na mochila. Nossa cidade fica num ponto especial. De um lado está o Recôncavo, pertinho do litoral, e do outro começa o sertão. Estamos no meio do caminho e é por isso que tanta gente passa por aqui",audio:"resposta-3.mp3"},
 {q:"Por que Feira é lugar de passagem ?",t:"Aqui, todo caminho dá em feira. A BR-116 atravessa o país do Ceará ao Rio Grande do Sul, e a BR-324 liga a cidade direto a Salvador. Resultado: muita gente que viaja entre o litoral, o interior da Bahia, o Sudeste e outros estados do Nordeste passa por aqui. É herança dos tempos dos boiadeiros. Só que hoje o pessoal chega de caminhão e de carro, em vez de boi. Isso ajuda muito o comércio, a logística e a indústria da cidade. E se você se perder, relaxa. É só perguntar que alguém ensina o caminho",audio:"resposta-4.mp3"},
 {q:"O que é a micareta de Feira ?",t:"Prepare o abadá, porque agora o assunto é festa. A Micareta de Feira é o nosso carnaval fora de época, com blocos, trio elétrico e muita animação pelas ruas. A tradição é antiga. O trajeto histórico da festa, na Avenida Presidente Dutra, vem desde 1937. Como a data nem sempre é a mesma, a dica é conferir o calendário antes de comprar o glitter",audio:"resposta-5.mp3"},
 
];

/* Recortes em PIXELS da imagem original (766x766). x,y = centro do topo da peça; rot = graus.
   (as pálpebras seguem a inclinação dos olhos; a boca segue a inclinação do sorriso) */
const S=766;
const topoPalpebra=(cx,cy,h,deg)=>{const r=deg*Math.PI/180;return [cx+h/2*Math.sin(r),cy-h/2*Math.cos(r)]};
const [lx,ly]=topoPalpebra(333,293,48,22), [rx,ry]=topoPalpebra(437,283,50,-20);
const parts=[
 {cls:"lid",  x:lx, y:ly, w:60, h:48, rot:22},   // olho esquerdo
 {cls:"lid",  x:rx, y:ry, w:70, h:50, rot:-20},  // olho direito
 {cls:"jaw",  x:385,y:365,w:100,h:40, rot:0}     // lábio inferior + queixo (cópia da imagem; começa abaixo dos dentes)
];
const avatar=document.getElementById("avatar");
parts.forEach(p=>{
  const d=document.createElement("div");d.className=p.cls;
  const L=p.x-p.w/2;
  Object.assign(d.style,{left:L/S*100+"%",top:p.y/S*100+"%",width:p.w/S*100+"%",height:p.h/S*100+"%"});
  if(p.rot)d.style.rotate=p.rot+"deg";
  if(p.cls==="jaw"){ // alinha o fundo do recorte com a imagem original
    const wF=p.w/S,hF=p.h/S;
    d.style.backgroundSize=(100/wF)+"% "+(100/hF)+"%";
    d.style.backgroundPosition=(L/S/(1-wF)*100)+"% "+(p.y/S/(1-hF)*100)+"%";
  }
  avatar.appendChild(d);
});
/* Boca aberta: usa os dentes que JÁ existem na imagem.
   "dentes" = borda inferior dos dentes (px da imagem). A cavidade escura nasce exatamente nessa
   borda e desce conforme a abertura, mais no centro e zero nas pontas (cantos da boca ficam fechados). */
const dentes=[[361,360.6],[364,362],[368,363.1],[372,364],[376,364.4],[380,364.1],[384,363.5],[388,362.3],[392,360.8],[396,359.2],[400,357.4],[404,355.6]];
const PROF=7.5;  // profundidade máxima da cavidade (px da imagem); aumente para abrir mais
const NS="http://www.w3.org/2000/svg";
const svg=document.createElementNS(NS,"svg");
svg.setAttribute("viewBox","0 0 "+S+" "+S);svg.setAttribute("class","bocasvg");
svg.innerHTML='<defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241012"/><stop offset="1" stop-color="#4b1b1e"/></linearGradient><clipPath id="cc"><path id="pc"/></clipPath></defs>'+
  '<path id="cav" fill="url(#gc)"/><ellipse id="lin" cx="382" rx="11" ry="3.4" fill="#8a3a3d" clip-path="url(#cc)"/>';
avatar.appendChild(svg);
const cav=svg.querySelector("#cav"),pc=svg.querySelector("#pc"),lin=svg.querySelector("#lin");
function desenharBoca(n){
  const d=n*PROF;
  if(d<0.2){cav.setAttribute("d","");pc.setAttribute("d","");return}
  const k=dentes.length-1;
  const topo=dentes.map(([x,y])=>x+","+(y-0.4)).join(" L");
  const base=dentes.map(([x,y],i)=>x+","+(y-0.4+d*Math.pow(Math.sin(Math.PI*i/k),0.7))).reverse().join(" L");
  const D="M"+topo+" L"+base+"Z";
  cav.setAttribute("d",D);pc.setAttribute("d",D);
  lin.setAttribute("cy",(365+d*0.95).toFixed(2));
  lin.setAttribute("opacity",Math.max(0,Math.min((n-0.5)*2,1)).toFixed(2)); // língua só aparece com a boca bem aberta
}

/* Piscar natural: fecha rápido, segura um instante e abre um pouco mais devagar.
   Intervalos aleatórios (2 a 6 s) e, às vezes, piscada dupla. */
const lids=[...avatar.querySelectorAll(".lid")];
function piscar(forca=1){
  const dur=190+Math.random()*70;
  lids.forEach(l=>l.animate([
    {transform:"scaleY(0)",easing:"cubic-bezier(.5,0,1,.6)"},       // fechando: acelera
    {transform:`scaleY(${forca})`,offset:.38},
    {transform:`scaleY(${forca})`,offset:.50,easing:"cubic-bezier(.2,.5,.4,1)"}, // abrindo: desacelera
    {transform:"scaleY(0)"}
  ],{duration:dur}));
}
function agendarPiscada(){
  setTimeout(()=>{
    piscar(0.96+Math.random()*.04);
    if(Math.random()<0.18)setTimeout(()=>piscar(1),dur2());   // piscada dupla
    agendarPiscada();
  },2200+Math.random()*3800);
}
const dur2=()=>260+Math.random()*80;
agendarPiscada();

const cap=document.getElementById("cap"),btns=document.getElementById("btns"),status=document.getElementById("status");

/* ---- Ajustes ---- */
const ABERTURA_MAX=1.4;   // --abertura vai de 1 (fechada) a 1.4 (máxima)
const GATE=6;             // volume médio (0-255) abaixo disso = silêncio

/* A boca é controlada por 2 variáveis CSS escritas no avatar:
   --abertura (1..ABERTURA_MAX) estica a mandíbula; --nivel (0..1) revela o interior escuro. */
function setBoca(n){
  desenharBoca(n);
  avatar.style.setProperty("--abertura",(1+n*(ABERTURA_MAX-1)).toFixed(3));
  avatar.style.setProperty("--nivel",n.toFixed(3));
}

/* Web Audio só funciona via http (Live Server). Em file:// o navegador muda o áudio,
   então tocamos normalmente e usamos um ritmo simulado para a boca. */
const analisavel=location.protocol!=="file:";
let ctx=null,analyser=null,dados=null,audio=null,fonte=null,raf=null;
let pico=40,atual=0,viuSinal=false,simulado=false;

function iniciarAudioContext(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=ctx.createAnalyser();
  analyser.fftSize=256;
  analyser.smoothingTimeConstant=0.4;
  dados=new Uint8Array(analyser.frequencyBinCount);
  analyser.connect(ctx.destination);
}

function nivelReal(){
  analyser.getByteFrequencyData(dados);
  let soma=0;for(let i=1;i<=24;i++)soma+=dados[i];   // faixa da voz
  const media=soma/24;
  if(media>0)viuSinal=true;
  pico=Math.max(pico*0.997,media,25);                // ganho automático: se adapta ao volume do mp3
  return media<GATE?0:Math.min(media/pico,1);
}
function nivelSimulado(t){                             // ritmo de "sílabas" (plano B)
  const v=Math.sin(t*13)*.5+Math.sin(t*21+1)*.3+Math.sin(t*5.3)*.2+.25;
  return Math.max(0,Math.min(v,1));
}

function loop(){
  const t=performance.now()/1000;
  if(!simulado&&analisavel&&!viuSinal&&audio.currentTime>0.6){
    simulado=true;status.textContent="⚠ Sem dados do analisador: usando ritmo simulado. Rode via Live Server.";
  }
  let alvo=(simulado||!analisavel)?nivelSimulado(t):nivelReal();
  alvo=Math.pow(alvo,0.8);                            // realça sons médios
  atual+=(alvo-atual)*(alvo>atual?0.65:0.3);          // abre rápido, fecha mais devagar
  setBoca(atual);
  raf=requestAnimationFrame(loop);
}

function parar(){
  cancelAnimationFrame(raf);raf=null;atual=0;
  setBoca(0);                                         // boca fechada
  avatar.classList.remove("is-talking");
  document.querySelectorAll(".q.on").forEach(b=>b.classList.remove("on"));
}

async function ask(i,btn){
  const item=perguntas[i];
  if(audio){audio.pause();audio.onended=audio.onerror=null}
  if(fonte){fonte.disconnect();fonte=null}
  parar();
  cap.textContent=item.t;btn.classList.add("on");
  viuSinal=false;simulado=false;pico=40;
  status.textContent=analisavel?"":"Modo file://: boca com ritmo simulado. Para sincronia real use Live Server.";
  try{
    audio=new Audio(item.audio);
    if(analisavel){
      iniciarAudioContext();
      if(ctx.state==="suspended")await ctx.resume();  // exige o clique do usuário
      fonte=ctx.createMediaElementSource(audio);
      fonte.connect(analyser);
    }
    audio.onended=parar;
    audio.onerror=()=>{parar();cap.textContent="Não consegui carregar "+item.audio+". Confira a pasta audios/ ao lado do index.html."};
    await audio.play();
    avatar.classList.add("is-talking");
    loop();
  }catch(e){
    parar();
    cap.textContent="Erro ao tocar o áudio ("+e.name+"). Confira ./audios/ e rode via Live Server.";
  }
}
perguntas.forEach((p,i)=>{
  const b=document.createElement("button");b.className="q";b.textContent=p.q;
  b.onclick=()=>ask(i,b);btns.appendChild(b);
});
</script>
</body>
</html>
